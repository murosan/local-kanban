version: '2'

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gofmt:
      rewrite-rules: { pattern: 'interface{}', replacement: 'any' }
    gofumpt:
      module-path: github.com/murosan/local-kanban
    goimports:
      local-prefixes: [github.com/murosan/local-kanban]

linters:
  enable:
    - bodyclose
    - gosec
  settings:
    gosec:
      excludes:
        - G301
        - G306

run:
  timeout: 5m
