version: 2

updates:
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'monthly'
      timezone: 'Asia/Tokyo'
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'monthly'
      timezone: 'Asia/Tokyo'
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      timezone: 'Asia/Tokyo'
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
      timezone: 'Asia/Tokyo'
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
